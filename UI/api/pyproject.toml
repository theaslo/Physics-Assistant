[project]
name = "langchain-client"
version = "0.1.0"
description = "Physics Assistant API with LangChain and Strands agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangChain for Physics 101 agents
    "langchain-mcp-adapters>=0.1.7",
    "langchain-ollama>=0.3.3",
    "langchain[anthropic,ollama,openai]>=0.3.25",
    "langgraph>=0.4.8",
    # Strands SDK for Physics 102-201-202 agents
    "strands-agents>=0.1.0",
    "mcp>=1.13.0,<2.0.0",
    # FastAPI
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "psutil>=7.0.0",
    "requests>=2.31.0",
]
