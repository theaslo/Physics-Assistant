[project]
name = "physics-assistant-database"
version = "0.1.0"
description = "Database API server for Physics Assistant platform"
authors = [
    {name = "Physics Assistant Team", email = "admin@physics-assistant.edu"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core database drivers
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.1",
    "neo4j==5.14.1",

    # Environment and configuration
    "python-dotenv==1.0.0",

    # Database utilities and migration tools
    "alembic==1.13.1",
    "sqlalchemy==2.0.23",

    # Connection pooling and utilities
    "aiopg==1.4.0",
    "asyncpg-utils==0.2.1",

    # API and web framework
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.0",

    # Monitoring and metrics
    "prometheus_client==0.19.0",

    # Mathematical processing
    "sympy>=1.12",
    "numpy>=1.24.0",
    "pandas>=2.0.0",

    # Computer vision and image processing
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",

    # Document processing
    "PyPDF2>=3.0.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
dev = [
    # Testing and development
    "httpx>=0.24,<0.28",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-mock==3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "httpx>=0.24,<0.28",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
]
