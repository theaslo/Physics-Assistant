# Alertmanager Configuration for Physics Assistant (Local Development)
# For production, configure real SMTP and Slack webhook endpoints

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'local-log'
  routes:
    - match:
        severity: critical
      receiver: 'local-log'
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'local-log'
      repeat_interval: 4h
    - match:
        severity: info
      receiver: 'local-log'
      repeat_interval: 24h

# For local dev, all alerts go to a single webhook receiver
# Alerts are still visible in Alertmanager UI at localhost:9093
# and in Grafana alert panels at localhost:3002
receivers:
  - name: 'local-log'
    webhook_configs:
      - url: 'http://dashboard-api:8002/dashboard/health'
        send_resolved: true

# Inhibit rules - suppress lower severity if higher severity fires
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'service']
