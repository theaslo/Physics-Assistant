# Minimal Database Services for Physics Assistant
version: '3.8'

networks:
  physics-network:
    external: true
    name: database_physics_network

volumes:
  postgres-data:
    driver: local
  neo4j-data:
    driver: local
  redis-data:
    driver: local

services:
  # Database Services
  postgres:
    build:
      context: .
      dockerfile: docker/database/postgresql/Dockerfile
    container_name: physics-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PHYSICS_DB_PASSWORD: ${PHYSICS_DB_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/backups:/var/lib/postgresql/backups
    networks:
      - physics-network
    restart: unless-stopped
    ports:
      - "5432:5432"

  neo4j:
    build:
      context: .
      dockerfile: docker/database/neo4j/Dockerfile
    container_name: physics-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j-data:/data
      - ./database/neo4j/logs:/logs
      - ./database/neo4j/backups:/var/lib/neo4j/backups
    networks:
      - physics-network
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"

  redis:
    build:
      context: .
      dockerfile: docker/database/redis/Dockerfile
    container_name: physics-redis
    volumes:
      - redis-data:/data
    networks:
      - physics-network
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Database API
  database-api:
    build:
      context: .
      dockerfile: docker/api/database-api/Dockerfile
    container_name: physics-database-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: physics_assistant
      POSTGRES_USER: physics_user
      POSTGRES_PASSWORD: ${PHYSICS_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: physics_redis_2024
      NEO4J_HOST: neo4j
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./database/logs:/app/logs
      - ./database/backups:/app/backups
    networks:
      - physics-network
    depends_on:
      - postgres
      - redis
      - neo4j
    restart: unless-stopped
    ports:
      - "8001:8001"