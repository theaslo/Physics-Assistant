version: '3.8'

networks:
  physics-network:
    external: true
    name: database_physics_network

services:
  # MCP Services with database logging integration
  mcp-forces:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: physics-mcp-forces
    ports:
      - "10100:10100"
    environment:
      MCP_SERVICE: forces
      MCP_PORT: 10100
      MCP_HOST: 0.0.0.0
      MCP_TRANSPORT: streamable_http
      DATABASE_API_HOST: physics-database-api
      DATABASE_API_PORT: 8001
    networks:
      - physics-network
    restart: unless-stopped

  mcp-kinematics:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: physics-mcp-kinematics
    ports:
      - "10101:10101"
    environment:
      MCP_SERVICE: kinematics
      MCP_PORT: 10101
      MCP_HOST: 0.0.0.0
      MCP_TRANSPORT: streamable_http
      DATABASE_API_HOST: physics-database-api
      DATABASE_API_PORT: 8001
    networks:
      - physics-network
    restart: unless-stopped

  mcp-math:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: physics-mcp-math
    ports:
      - "10103:10103"
    environment:
      MCP_SERVICE: math
      MCP_PORT: 10103
      MCP_HOST: 0.0.0.0
      MCP_TRANSPORT: streamable_http
      DATABASE_API_HOST: physics-database-api
      DATABASE_API_PORT: 8001
    networks:
      - physics-network
    restart: unless-stopped

  mcp-energy:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: physics-mcp-energy
    ports:
      - "10105:10105"
    environment:
      MCP_SERVICE: energy
      MCP_PORT: 10105
      MCP_HOST: 0.0.0.0
      MCP_TRANSPORT: streamable_http
      DATABASE_API_HOST: physics-database-api
      DATABASE_API_PORT: 8001
    networks:
      - physics-network
    restart: unless-stopped

  mcp-momentum:
